{% load static %}{% if course.thumbnail %}<img src="{% url 'courses:thumbnail' course.pk %}" alt="Thumbnail of {{ course.title }}" class="{{ css|default:'h-40 w-full object-cover' }}" loading="lazy">{% else %}<img src="{% static 'img/default_thumbnail.svg' %}" alt="Default course thumbnail" class="{{ css|default:'h-40 w-full object-cover' }}" loading="lazy">{% endif %}
