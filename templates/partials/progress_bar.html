<div class="mb-1 flex justify-between text-xs font-medium text-slate-500"><span>Progress</span><span>{{ value }}%</span></div>
<div class="progress" role="progressbar" aria-label="Progress" aria-valuenow="{{ value }}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill{% if value >= 100 %} progress-done{% endif %}" style="width: {{ value }}%"></div></div>
