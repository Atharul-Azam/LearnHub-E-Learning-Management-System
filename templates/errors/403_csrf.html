{% extends "base.html" %}
{% block title %}Request rejected{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg py-12 text-center">
  <p class="text-5xl font-bold text-indigo-600">403</p>
  <h1 class="mt-3 text-2xl font-bold">Request could not be verified</h1>
  <p class="mt-2 text-slate-600">Your form session has expired or the request was not valid. Please go back, reload the page and try again.</p>
  <a class="btn btn-primary mt-6" href="{% url 'home' %}">Back to LearnHub</a>
</div>
{% endblock %}
